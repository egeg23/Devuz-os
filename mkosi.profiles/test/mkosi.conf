# ТЕСТОВЫЙ образ — только для Actions, коробкам не ставить.
# Включается так: mkosi --profile=test ...
#
# Боевой образ не принимает учётные данные (systemd.import_credentials=no):
# systemd-stub берёт файлы *.cred с ESP без проверки подписи, а учётные
# данные systemd вроде tmpfiles.extra пишут файлы в /etc — это был бы
# выполнимый от root код для любого, у кого в руках диск. Тестовый образ
# учётные данные принимает (через них тест передаёт devuz.test) и содержит
# тестовые службы: devuz-test, самопроверку, тест обновления.

[Content]
ExtraTrees=%D/mkosi.profiles/test/extra
# Тест ключа восстановления проверяет его программой cryptsetup.
# curl — проверка https у Caddy в тесте служб.
Packages=cryptsetup-bin
        curl
# Пустое значение сбрасывает строку ядра из mkosi.conf: та же строка, но
# без systemd.import_credentials=no.
KernelCommandLine=
KernelCommandLine=
        rw
        systemd.firstboot=no
