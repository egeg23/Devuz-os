# Только тестовый образ: тестовый реестр на раннере Actions (без TLS) —
# для теста подписи контейнеров (образы devuz/hello).
[[registry]]
location = "10.0.2.2:5000"
insecure = true

# Заглушка «Офиса» (тест места под «Офис»): имя — как у настоящего,
# ghcr.io/egeg23/devuz-office, а лежит в тестовом реестре.
[[registry]]
prefix = "ghcr.io/egeg23/devuz-office"
location = "10.0.2.2:5000/devuz-office"
insecure = true
