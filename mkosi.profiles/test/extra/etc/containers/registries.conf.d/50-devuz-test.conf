# Только тестовый образ: тестовый реестр на раннере Actions (без TLS).
[[registry]]
location = "10.0.2.2:5000"
insecure = true

# Боевые имена образов (registry.devuz.invalid/…) берутся из тестового
# реестра. Подпись при этом проверяется на боевое имя: в Actions образы
# подписаны с --sign-container-identity registry.devuz.invalid/….
[[registry]]
prefix = "registry.devuz.invalid"
location = "10.0.2.2:5000"
insecure = true
