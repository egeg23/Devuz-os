# РАЗВЕДКА (неделя 1, задача 9), не продукт: тот же образ, но без
# root-раздела — только ESP и /usr. Корень — пустой tmpfs, /etc пустой.
# Цель — увидеть, что из /etc Debian нужно для загрузки (вход для недели 2).
# Включается только вручную: mkosi --profile=usr-only build.

[Output]
# Пустое значение сбрасывает список из mkosi.conf.
RepartDirectories=
RepartDirectories=%D/mkosi.profiles/usr-only/repart

[Content]
KernelCommandLine=root=tmpfs
# С пустым /etc systemd считает загрузку первой и запускает мастер
# systemd-firstboot, который ждёт нажатия клавиши (первая находка
# разведки). Выключаем его, чтобы увидеть, что ломается дальше.
KernelCommandLine=systemd.firstboot=no
