# SPDX-License-Identifier: LGPL-2.1-or-later
# DevUz OS — рецепт образа. Каждая опция сверена с man mkosi v27.1.

[Config]
MinimumVersion=27.1

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware
Architecture=x86-64

[Output]
ImageId=devuz
# ImageVersion берётся из исполняемого файла mkosi.version
# (ГГГГ.ММ.ДД.<номер прогона Actions>).
Output=%i_%v
Format=disk
SplitArtifacts=uki,partitions
# Только json: формат changelog во время сборки скачивает журналы изменений
# с metadata.ftp-master.debian.org, и сбой этого сервиса (503) роняет
# всю сборку. Разница пакетов между сборками строится по json.
ManifestFormat=json
CompressOutput=no
# Постоянное зерно для systemd-repart: одинаковые UUID разделов от сборки
# к сборке. Задел на повторяемость, без обещания «байт в байт».
Seed=1847ab00-e23f-42e4-953a-c860c75b0a30
RepartDirectories=mkosi.repart

[Build]
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
CacheDirectory=mkosi.cache
# Внимание: кэш Incremental не замечает новых пакетов в репозитории
# (в т.ч. нового ядра в backports). У себя — mkosi -ff build, чтобы
# пересобрать с нуля. В Actions кэш между прогонами не хранится: каждая
# сборка с чистого листа (она и так идёт ~2–3 минуты).
Incremental=yes
WithNetwork=no
# Хеш коммита для BUILD_ID в os-release; DEVUZ_TEST_BROKEN=1 — «битая»
# версия для теста отката (см. mkosi.postinst).
Environment=DEVUZ_BUILD_ID

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
# «+3» — счёт загрузок: systemd-boot даёт этой версии 3 попытки, после
# каждой неудачной уменьшает счётчик в имени файла, а при 0 берёт прошлую
# версию. Успешную загрузку отмечает systemd-bless-boot (переименовывает файл
# в devuz_<версия>.efi). В mkosi v27.1 «+&c» из man в коде нет — пишем сами.
UnifiedKernelImageFormat=%i_%v+3
KernelInitrdModules=default
# /usr — отдельный раздел erofs под dm-verity. mkosi сам вписывает
# usrhash=<корень хеша> в строку ядра UKI, а systemd (veritysetup- и
# fstab-генераторы в initrd) по нему поднимает /dev/mapper/usr и монтирует
# его в /usr. Слот находится по UUID разделов, которые systemd-repart
# выводит из корня хеша, поэтому каждая версия UKI грузит «свой» /usr.
# systemd.firstboot=no: у коробки нет мастера первой загрузки на консоли
# (язык, пояс, пароль): всё уже есть в заготовке /etc.
# systemd.import_credentials=no: коробка не принимает учётные данные systemd
# ни с ESP (*.cred — без подписи), ни из SMBIOS. Иначе любой, у кого в руках
# диск, мог бы через tmpfiles.extra и подобные записать файлы в /etc и
# выполнить код от root (ключ диска в TPM от этого не защищает: учётные
# данные идут в PCR 12, а он в политику не входит). Тестовый профиль
# (mkosi.profiles/test/) эту строку убирает.
# Тот же список повторён в mkosi.profiles/test/mkosi.conf — менять вместе.
KernelCommandLine=
        rw
        systemd.firstboot=no
        systemd.import_credentials=no
# Root создаётся при первой загрузке (mkosi.extra/usr/lib/repart.d) сразу
# зашифрованным (LUKS2, ключ в TPM): для этого в initrd нужны
# systemd-repart, systemd-cryptsetup и библиотеки TPM2 (systemd открывает их
# сам, через dlopen, поэтому зависимостями пакетов они не тянутся).
InitrdPackages=
        systemd-repart
        systemd-cryptsetup
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64
Packages=
        # Пустой пакет из mkosi.packages/ (tools/prepare-packages.sh): закрывает
        # зависимость ядра на генератор initrd, чтобы не ставился dracut.
        devuz-no-initramfs
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-repart
        systemd-cryptsetup
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64
        systemd-container
        udev
        kmod
        dbus-broker
        util-linux
        iproute2
        ca-certificates
        debian-archive-keyring
        # systemd-sysupdate проверяет подпись SHA256SUMS.gpg программой gpg.
        gpg
        # Службы — контейнеры под Podman (юниты quadlet). Скачивается только
        # образ с нашей подписью: /etc/containers/policy.json.
        podman
        crun
        netavark
        aardvark-dns
        catatonit
# Debian кладёт свой /etc/issue; без него agetty читает /usr/lib/issue и
# /usr/lib/issue.d — там наш экран «Состояние».
RemoveFiles=
        /etc/issue
        /etc/issue.net

[Validation]
# Ключ для подписи корня хеша (раздел usr-verity-sig): mkosi.key/mkosi.crt.
# В репозитории их нет никогда: в Actions тестовые генерируются на лету
# (mkosi genkey), у себя — так же. Без ключа сборка падает.
Verity=signed
# Secure Boot: UKI и systemd-boot подписываются тем же ключом
# (mkosi.key/mkosi.crt). Ключ тестовый, боевой — на аппаратном ключе
# владельца (неделя 8, заводская флешка).
SecureBoot=yes
# Не класть ключи для автозаписи в прошивку (loader/keys/auto): иначе
# коробка в режиме настройки сама записала бы себе тестовый ключ.
SecureBootAutoEnroll=no

[Runtime]
# Тестовый запуск под Secure Boot: OVMF с поддержкой Secure Boot, наш
# сертификат mkosi.crt вписан в переменные прошивки (FirmwareVariables=custom).
# Строку ядра из SMBIOS под Secure Boot systemd-stub не берёт — тесты
# включаются учётными данными (devuz.test).
Firmware=uefi-secure-boot
FirmwareVariables=custom
RAM=2G
CPUs=2
# В образе только ESP и слоты /usr; при запуске в QEMU диск растёт до 8 ГБ,
# и в свободном месте systemd-repart создаёт root (как на настоящем SSD).
RuntimeSize=8G
# Виртуальный TPM (swtpm из tools tree): без него root не зашифровать.
TPM=yes
