# SPDX-License-Identifier: LGPL-2.1-or-later
# DevUz OS — рецепт образа. Каждая опция сверена с man mkosi v27.1.

[Config]
MinimumVersion=27.1

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware
Architecture=x86-64

[Output]
ImageId=devuz
# ImageVersion берётся из исполняемого файла mkosi.version
# (ГГГГ.ММ.ДД.<номер прогона Actions>).
Output=%i_%v
Format=disk
SplitArtifacts=uki,partitions
# Только json: формат changelog во время сборки скачивает журналы изменений
# с metadata.ftp-master.debian.org, и сбой этого сервиса (503) роняет
# всю сборку. Разница пакетов между сборками строится по json.
ManifestFormat=json
CompressOutput=no
# Постоянное зерно для systemd-repart: одинаковые UUID разделов от сборки
# к сборке. Задел на повторяемость, без обещания «байт в байт».
Seed=1847ab00-e23f-42e4-953a-c860c75b0a30
RepartDirectories=mkosi.repart

[Build]
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
CacheDirectory=mkosi.cache
# Внимание: кэш Incremental не замечает новых пакетов в репозитории
# (в т.ч. нового ядра в backports). У себя — mkosi -ff build, чтобы
# пересобрать с нуля. В Actions кэш между прогонами не хранится: каждая
# сборка с чистого листа (она и так идёт ~2–3 минуты).
Incremental=yes
WithNetwork=no
# Хеш коммита для BUILD_ID в os-release (см. mkosi.postinst).
Environment=DEVUZ_BUILD_ID

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
# «+3» — счёт загрузок: systemd-boot даёт этой версии 3 попытки, после
# каждой неудачной уменьшает счётчик в имени файла, а при 0 берёт прошлую
# версию. Успешную загрузку отмечает systemd-bless-boot (переименовывает файл
# в devuz_<версия>.efi). В mkosi v27.1 «+&c» из man в коде нет — пишем сами.
UnifiedKernelImageFormat=%i_%v+3
KernelInitrdModules=default
# /usr — отдельный раздел erofs под dm-verity. mkosi сам вписывает
# usrhash=<корень хеша> в строку ядра UKI, а systemd (veritysetup- и
# fstab-генераторы в initrd) по нему поднимает /dev/mapper/usr и монтирует
# его в /usr. Слот находится по UUID разделов, которые systemd-repart
# выводит из корня хеша, поэтому каждая версия UKI грузит «свой» /usr.
KernelCommandLine=
        rw
Packages=
        # Пустой пакет из mkosi.packages/ (tools/prepare-packages.sh): закрывает
        # зависимость ядра на генератор initrd, чтобы не ставился dracut.
        devuz-no-initramfs
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-repart
        systemd-container
        udev
        kmod
        dbus-broker
        util-linux
        iproute2
        ca-certificates
        debian-archive-keyring
# Debian кладёт свой /etc/issue; без него agetty читает /usr/lib/issue и
# /usr/lib/issue.d — там наш экран «Состояние».
RemoveFiles=
        /etc/issue
        /etc/issue.net

[Validation]
# Ключ для подписи корня хеша (раздел usr-verity-sig): mkosi.key/mkosi.crt.
# В репозитории их нет никогда: в Actions тестовые генерируются на лету
# (mkosi genkey), у себя — так же. Без ключа сборка падает.
Verity=signed

[Runtime]
# Тестовый запуск: без Secure Boot (с ним systemd-stub игнорирует строку
# ядра из SMBIOS, и самопроверка не включится — это вопрос недели 3).
Firmware=uefi
RAM=2G
CPUs=2
