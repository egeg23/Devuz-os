# Аварийный режим в initrd (не создался root, не открылся диск, нет места);
# сам скрипт — /usr/lib/devuz/initrd-emergency (пишет и причину, если root нет):
# без этого правила — вечное «Press Enter» у коробки без человека. Строка на
# экран, 2 минуты и перезагрузка; три такие подряд — systemd-boot вернёт
# прошлую версию (счёт в имени UKI). Счёт пауз (reboot-guard) живёт в основной
# системе: здесь нет её файлов, поэтому пауза — постоянные 2 минуты.
[Service]
ExecStart=
ExecStart=-/usr/lib/devuz/initrd-emergency "режим восстановления"
ExecStopPost=
