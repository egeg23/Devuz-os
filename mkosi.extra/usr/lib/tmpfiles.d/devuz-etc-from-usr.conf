# /etc копируется из заготовки только при первой загрузке. То, что должно
# обновляться вместе с системой, — ссылками в /usr (под verity):
# корневые сертификаты (по ним проверяется https сервера обновлений —
# иначе через год-два коробка перестанет обновляться).
L+ /etc/ssl/certs/ca-certificates.crt - - - - /usr/share/factory/etc/ssl/certs/ca-certificates.crt
