# Аппаратный сторож: зависла сама система (не служба) — перезагрузка.
# Если сторожа у платы нет, systemd просто пишет об этом в журнал.
[Manager]
# 2 мин, а не 30 с: под нехваткой памяти PID 1 на дешёвом диске может
# задуматься — ложная перезагрузка дороже запоздалой.
RuntimeWatchdogSec=2min
RebootWatchdogSec=10min
