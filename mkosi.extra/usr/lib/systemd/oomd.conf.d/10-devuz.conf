# systemd-oomd: следит за давлением на память (PSI) и своп. Что именно
# останавливать — решают ломти: devuz-ai.slice (модели) — первым,
# devuz-ui.slice (Caddy, PostgreSQL, «Ядро») — в последнюю очередь.
[OOM]
SwapUsedLimit=90%
DefaultMemoryPressureDurationSec=20s
