# Сторож для всех долгих служб DevUz: юниты с именем devuz-svc-*.service
# (в том числе контейнеры quadlet devuz-svc-*.container) получают это
# правило сами, по префиксу имени.
#  - упала (код ошибки, сигнал, не ответила сторожу WatchdogSec=) —
#    systemd поднимает её через 2 с;
#  - три падения за 10 минут — больше не поднимаем, служба в failed и
#    один раз зовём человека: devuz-alert@<служба>.
[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=3
OnFailure=devuz-alert@%n.service

[Service]
Restart=on-failure
RestartSec=2s
# Перезапуск — сразу в activating, минуя failed: иначе OnFailure= (сигнал)
# срабатывал бы на каждом падении, а не только когда попытки кончились
# (systemd 257, проверено тестом).
RestartMode=direct
