# У коробки нет человека у консоли, а root заблокирован: аварийный режим
# без этого правила — вечное «Press Enter». Вместо этого — строка в журнал,
# 2 минуты (успеть увидеть на экране) и перезагрузка. Новая версия получает
# так 3 попытки (счёт в имени UKI), потом systemd-boot вернёт прошлую.
[Service]
ExecStart=
ExecStart=-/bin/sh -c 'echo "DEVUZ-EMERGENCY аварийный режим — перезагрузка через 2 мин"; sleep 120; systemctl --no-block reboot || { echo "DEVUZ-EMERGENCY обычная перезагрузка не прошла — принудительная"; sync; systemctl --force --force reboot; }'
ExecStopPost=
