# У коробки нет человека у консоли, а root заблокирован: аварийный режим
# без этого правила — вечное «Press Enter». Вместо этого — строка в журнал,
# пауза (успеть увидеть на экране) и перезагрузка. Новая версия получает
# так 3 попытки (счёт в имени UKI), потом systemd-boot вернёт прошлую. Если
# не грузится и она — паузы растут до часа (reboot-guard), а не круг.
[Service]
ExecStart=
ExecStart=-/usr/lib/devuz/reboot-guard fail "аварийный режим"
ExecStopPost=
