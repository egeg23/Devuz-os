# Загрузка считается удачной (systemd-bless-boot снимает счётчик попыток),
# только если дошла до devuz-ready.service. Упала готовность — не засчитана,
# после 3 таких загрузок systemd-boot сам вернёт прошлую версию.
[Unit]
Requires=devuz-ready.service
After=devuz-ready.service
