# У коробки нет человека у консоли, а root заблокирован: аварийный режим
# без этого правила — вечное «Press Enter». Вместо этого — строка в журнал,
# пауза (успеть увидеть на экране) и перезагрузка (reboot-guard: с 4-й
# неудачи подряд паузы растут до часа). Новая версия получает
# так 3 попытки (счёт в имени UKI), потом systemd-boot вернёт прошлую.
[Service]
ExecStart=
ExecStart=-/usr/lib/devuz/reboot-guard fail "режим восстановления"
ExecStopPost=
