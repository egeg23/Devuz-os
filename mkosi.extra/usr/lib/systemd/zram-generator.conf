# Сжатый своп в памяти: половина памяти, не больше 8 ГБ, zstd. Веса моделей
# лежат в файлах (mmap) и сюда не попадают — сжимается только «живая» память
# служб, и коробка под нагрузкой не начинает писать своп на SSD.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
