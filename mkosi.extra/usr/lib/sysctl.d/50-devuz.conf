# Debian не кладёт 50-default.conf systemd: защиту ссылок и прочее включаем сами.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 1
# Клавиши SysRq у коробки: без перезагрузки/выключения с клавиатуры.
kernel.sysrq = 0
kernel.kptr_restrict = 1
fs.suid_dumpable = 0
