# Root создаётся при первой загрузке: systemd-repart в initrd читает это
# описание из /usr (/sysusr/usr/lib/repart.d), находит свободное место на
# диске, где лежит /usr, и делает там раздел root на всё оставшееся место.
# Остальные разделы (ESP, слоты A/B) описаниями здесь не покрыты — repart
# их не трогает.
#
# Encrypt=tpm2: раздел сразу LUKS2, ключ запечатан в TPM коробки. Политика
# по умолчанию у systemd-repart: PCR 7 (состояние Secure Boot: чьи ключи в
# прошивке) + подписанная политика PCR 11 (UKI). Подпись PCR 11 mkosi кладёт
# в UKI (systemd-measure, тем же ключом, что и Secure Boot), открытый ключ
# systemd-stub передаёт в initrd. Поэтому после обновления (новый UKI,
# подписанный тем же ключом) диск открывается сам, а с другим ключом
# Secure Boot — нет.
[Partition]
Type=root
Format=ext4
Encrypt=tpm2
Label=root
SizeMinBytes=1G
