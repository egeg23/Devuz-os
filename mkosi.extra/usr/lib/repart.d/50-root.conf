# Root создаётся при первой загрузке: systemd-repart в initrd читает это
# описание из /usr (/sysusr/usr/lib/repart.d), находит свободное место на
# диске, где лежит /usr, и делает там раздел root на всё оставшееся место.
# Остальные разделы (ESP, слоты A/B) описаниями здесь не покрыты — repart
# их не трогает.
[Partition]
Type=root
Format=ext4
Label=root
SizeMinBytes=1G
