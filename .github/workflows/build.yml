# SPDX-License-Identifier: LGPL-2.1-or-later
# Сборка образа DevUz OS и тест загрузки в QEMU.
# Версия mkosi — v27.1 (та же, что в README). Меняем в обоих местах сразу.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sabotage:
        description: "Проверка теста (no-kernel, emergency, corrupt-usr, unsigned — ожидается красный)"
        type: choice
        default: none
        options: [none, no-kernel, emergency, corrupt-usr, unsigned]

permissions:
  contents: read
  actions: read   # чтобы скачать манифест последней сборки main для сравнения

concurrency:
  # Ручные прогоны (проверка теста, разведка) не отменяют друг друга.
  group: build-${{ github.ref }}-${{ inputs.sabotage || 'none' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SABOTAGE: ${{ inputs.sabotage || 'none' }}
      WORK: /mnt/devuz
    steps:
      - uses: actions/checkout@v4

      - name: Место на диске и рабочие каталоги
        run: |
          df -h / /mnt || true
          # На / у раннера мало места, на /mnt — больше: туда кэш, вывод и
          # временные файлы mkosi.
          sudo mkdir -p "$WORK"
          sudo chown "$(id -u):$(id -g)" "$WORK"
          mkdir -p "$WORK"/{cache,output,workspace}
          echo "MKOSI_DIRS=--cache-directory=$WORK/cache --output-directory=$WORK/output --workspace-directory=$WORK/workspace" >>"$GITHUB_ENV"

      - name: Установить mkosi v27.1
        uses: systemd/mkosi@v27.1

      - name: OVMF на раннере (обход ошибки mkosi v27.1)
        run: |
          # При FirmwareVariables=custom mkosi v27.1 ищет OVMF_VARS_4M.fd на самом
          # раннере, а не в tools tree. Ставим ovmf, чтобы файл был по тому же пути.
          sudo apt-get install -y --no-install-recommends ovmf
          ls -l /usr/share/OVMF/OVMF_VARS_4M.fd

      - name: Свежий debian-archive-keyring
        run: |
          # В Ubuntu 24.04 keyring старый, без ключей trixie. Берём последний
          # из архива Debian и ставим поверх.
          pool=http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/
          deb=$(curl -fsSL "$pool" | grep -oE 'debian-archive-keyring_[0-9][0-9.]*_all\.deb' | sort -uV | tail -n1)
          echo "Берём $deb"
          curl -fsSLO "$pool$deb"
          sudo dpkg -i "$deb"
          dpkg-query -W debian-archive-keyring
          ls -l /usr/share/keyrings/ | grep -i debian
          test -e /usr/share/keyrings/debian-archive-keyring.gpg || {
            echo "::error::нет /usr/share/keyrings/debian-archive-keyring.gpg"; exit 1; }

      - name: Версия, хеш коммита, время коммита
        run: |
          echo "DEVUZ_BUILD_ID=$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -c1-12)" >>"$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
          echo "DEVUZ_VERSION=$(./mkosi.version)" >>"$GITHUB_ENV"

      - name: Тестовый ключ подписи verity (на лету, никуда не сохраняется)
        run: |
          mkosi genkey
          openssl x509 -in mkosi.crt -noout -subject -enddate

      - name: Тестовый ключ подписи обновлений GPG (на лету, никуда не сохраняется)
        run: |
          # Закрытый ключ живёт только в $GNUPGHOME этого прогона. Открытый кладём
          # в образ по пути, где его ищет systemd-sysupdate (systemd 257:
          # /usr/lib/systemd/import-pubring.gpg) — через отдельное дерево файлов.
          export GNUPGHOME="$WORK/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "DevUz test updates <noreply@devuz.invalid>" ed25519 sign 30d
          mkdir -p "$WORK/keys-tree/usr/lib/systemd"
          gpg --export >"$WORK/keys-tree/usr/lib/systemd/import-pubring.gpg"
          gpg --list-keys
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "MKOSI_DIRS=$MKOSI_DIRS --extra-tree=$WORK/keys-tree" >>"$GITHUB_ENV"

      - name: Пакеты для сборки (ядро из Release, без dracut)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/prepare-packages.sh

      - name: Конфигурация
        run: mkosi $MKOSI_DIRS --image-version="$DEVUZ_VERSION" summary

      - name: Сборка тестового образа (профиль test)
        run: |
          extra=""
          if [ "$SABOTAGE" = no-kernel ]; then
            echo "::warning::Собираем образ без ядра — проверка, что тест станет красным"
            extra="--bootable=no"
          elif [ "$SABOTAGE" = unsigned ]; then
            echo "::warning::Собираем образ без подписи Secure Boot — прошивка не должна его запустить"
            extra="--secure-boot=no"
          fi
          start=$(date +%s)
          # Тестовый образ: тестовые службы и приём учётных данных
          # (mkosi.profiles/test/). На нём идут все тесты загрузки.
          mkosi $MKOSI_DIRS --profile=test --image-version="$DEVUZ_VERSION" $extra -f build
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >>"$GITHUB_ENV"
          ls -la "$WORK/output"

      - name: Сборка боевого образа
        if: env.SABOTAGE == 'none'
        run: |
          # Боевой образ (без профиля) — то, что уходит в артефакты и на
          # коробки. Отличается от тестового только тестовыми службами и
          # строкой ядра; проверки ниже — что отличия именно такие.
          mkdir -p "$WORK/output-prod"
          mkosi --cache-directory="$WORK/cache" --output-directory="$WORK/output-prod" \
                --workspace-directory="$WORK/workspace" --extra-tree="$WORK/keys-tree" \
                --image-version="$DEVUZ_VERSION" -f build
          ls -la "$WORK/output-prod"

      - name: Проверка боевого образа (нет тестовых служб, учётные данные не принимаются)
        if: env.SABOTAGE == 'none'
        run: |
          rc=0
          uki="$WORK/output-prod/devuz_$DEVUZ_VERSION.efi"
          objcopy -O binary --only-section=.cmdline "$uki" "$WORK/prod.cmdline"
          echo "Строка ядра боевого UKI: $(tr -d '\0' <"$WORK/prod.cmdline")"
          grep -qw 'systemd.import_credentials=no' "$WORK/prod.cmdline" ||
            { echo "::error::в боевом UKI нет systemd.import_credentials=no"; rc=1; }
          for name in devuz-test.service devuz-selftest.service DEVUZ-SELFTEST DEVUZ-UPDATE; do
            if grep -qaF "$name" "$WORK/output-prod/devuz_$DEVUZ_VERSION.raw"; then
              echo "::error::в боевом образе есть тестовое: $name"; rc=1
            fi
          done
          # И обратная проверка: тестовый образ правда другой.
          objcopy -O binary --only-section=.cmdline "$WORK/output/devuz_$DEVUZ_VERSION.efi" "$WORK/test.cmdline"
          ! grep -qw 'systemd.import_credentials=no' "$WORK/test.cmdline" ||
            { echo "::error::тестовый UKI не принимает учётные данные — тесты бы не работали"; rc=1; }
          echo "- боевой образ: тестовых служб нет, \`systemd.import_credentials=no\` в UKI" >>"$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Проверка пакетов
        if: env.SABOTAGE == 'none'
        run: |
          python3 - "$WORK/output-prod/devuz_$DEVUZ_VERSION.manifest" <<'PY'
          import json, os, sys
          pkgs = {p["name"]: p["version"] for p in json.load(open(sys.argv[1]))["packages"]}
          errors = []
          if "dracut" in pkgs or "dracut-core" in pkgs:
              errors.append("в образ попал dracut")
          kernel = pkgs.get("linux-image-amd64", "нет")
          pinned = os.environ.get("KERNEL_PINNED")
          if pinned and kernel != pinned:
              errors.append(f"ядро {kernel}, а в kernel.lock {pinned}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Пакеты\n- всего: {len(pkgs)}\n- linux-image-amd64: `{kernel}`"
                      f" ({'из Release, по kernel.lock' if pinned else 'из backports, Release не найден'})\n")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

      - name: Проверка разметки
        if: env.SABOTAGE == 'none'
        run: |
          echo "## Разметка" >>"$GITHUB_STEP_SUMMARY"
          python3 tests/check-partitions.py "$WORK/output-prod/devuz_$DEVUZ_VERSION.raw" "$DEVUZ_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Тест загрузки (до сжатия)
        run: |
          export MKOSI_ARGS="$MKOSI_DIRS --profile=test --image-version=$DEVUZ_VERSION"
          export EXPECT_VERSION="$DEVUZ_VERSION"
          case "$SABOTAGE" in
            no-kernel|unsigned) export TEST_TIMEOUT=300 ;;
            emergency) export TEST_CRED=emergency TEST_TIMEOUT=300 ;;
            corrupt-usr)
              echo "::warning::Портим /usr в готовом образе — dm-verity должна не дать загрузиться"
              python3 tests/corrupt-usr.py "$WORK/output/devuz_$DEVUZ_VERSION.raw"
              export TEST_TIMEOUT=300 ;;
          esac
          tests/boot-test.sh

      - name: Тест обновления A→B (systemd-sysupdate)
        if: env.SABOTAGE == 'none'
        run: |
          # Вторая версия того же коммита: V.1. Собираем в свой каталог, кэш
          # общий — пакеты второй раз не качаются.
          next="$DEVUZ_VERSION.1"
          mkdir -p "$WORK/output-next" "$WORK/serve-next"
          mkosi --cache-directory="$WORK/cache" --output-directory="$WORK/output-next" \
                --workspace-directory="$WORK/workspace" --extra-tree="$WORK/keys-tree" \
                --profile=test --image-version="$next" -f build
          python3 tests/publish-update.py "$WORK/output-next" "$next" "$WORK/serve-next"
          gpg --batch --detach-sign --output "$WORK/serve-next/SHA256SUMS.gpg" "$WORK/serve-next/SHA256SUMS"
          python3 -m http.server 8080 --directory "$WORK/serve-next" >"$WORK/http-next.log" 2>&1 &
          # Запускаем образ V; служба теста ставит V.1 и перезагружается в неё.
          export MKOSI_ARGS="$MKOSI_DIRS --profile=test --image-version=$DEVUZ_VERSION"
          export TEST_CRED="update,http://10.0.2.2:8080/,$next"
          export EXPECT_VERSION="$next" LOG=update.log TEST_TIMEOUT=900
          export TEST_TITLE="Тест обновления A→B"
          rc=0; tests/boot-test.sh || rc=$?
          grep -q 'DEVUZ-UPDATE INSTALLED' update.log || { echo "::error::sysupdate не поставил обновление"; rc=1; }
          # Только вывод после DEVUZ-UPDATE START: подпись должна проверить
          # сама установка, а не предварительный «list».
          sed -n '/DEVUZ-UPDATE START/,$p' update.log >update-install.log
          if grep -q 'Good signature' update-install.log; then
            echo "- подпись SHA256SUMS.gpg проверена: \`$(grep -m1 -o 'Good signature.*' update-install.log)\`" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::error::нет «Good signature» — подпись обновления не проверялась"; rc=1
          fi
          echo "- запросы к серверу обновлений:" >>"$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$WORK/http-next.log" >>"$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Тест ключей диска (TPM, чужой PCR 7, ключ восстановления)
        if: env.SABOTAGE == 'none'
        run: |
          export MKOSI_ARGS="$MKOSI_DIRS --profile=test --image-version=$DEVUZ_VERSION"
          export TEST_CRED=luks EXPECT_VERSION="$DEVUZ_VERSION" LOG=luks.log
          export TEST_TITLE="Тест ключей диска"
          rc=0; tests/boot-test.sh || rc=$?
          for k in TPM_UNLOCK RECOVERY_ENROLLED PCR7_CHANGED_TPM_UNLOCK RECOVERY_OPEN; do
            line=$(grep -m1 -o "DEVUZ-LUKS $k.*" luks.log || true)
            echo "- ${line:-❌ нет DEVUZ-LUKS $k}" >>"$GITHUB_STEP_SUMMARY"
            [ -n "$line" ] || rc=1
          done
          grep -q 'DEVUZ-LUKS OK' luks.log || { echo "::error::тест ключей диска не прошёл"; rc=1; }
          exit $rc

      - name: Тест отката (битое обновление → 3 попытки → старая версия)
        if: env.SABOTAGE == 'none'
        run: |
          bad="$DEVUZ_VERSION.2"
          mkdir -p "$WORK/output-bad" "$WORK/serve-bad"
          mkosi --cache-directory="$WORK/cache" --output-directory="$WORK/output-bad" \
                --workspace-directory="$WORK/workspace" --extra-tree="$WORK/keys-tree" \
                --profile=test --image-version="$bad" --environment=DEVUZ_TEST_BROKEN=1 -f build
          python3 tests/publish-update.py "$WORK/output-bad" "$bad" "$WORK/serve-bad"
          gpg --batch --detach-sign --output "$WORK/serve-bad/SHA256SUMS.gpg" "$WORK/serve-bad/SHA256SUMS"
          python3 -m http.server 8081 --directory "$WORK/serve-bad" >"$WORK/http-bad.log" 2>&1 &
          # V ставит «битую» V.2; та 3 раза не доходит до готовности,
          # systemd-boot возвращает V — проверка должна закончиться на V.
          export MKOSI_ARGS="$MKOSI_DIRS --profile=test --image-version=$DEVUZ_VERSION"
          export ALLOW_FAILED_START=1
          export TEST_CRED="update,http://10.0.2.2:8081/,$DEVUZ_VERSION"
          export EXPECT_VERSION="$DEVUZ_VERSION" LOG=rollback.log TEST_TIMEOUT=900
          export TEST_TITLE="Тест отката"
          rc=0; tests/boot-test.sh || rc=$?
          grep -q 'DEVUZ-UPDATE INSTALLED' rollback.log || { echo "::error::sysupdate не поставил «битую» версию"; rc=1; }
          tries=$(grep -c 'DEVUZ-READY-BROKEN' rollback.log || true)
          echo "- «битая» $bad не дошла до готовности: $tries раз(а)" >>"$GITHUB_STEP_SUMMARY"
          [ "$tries" -ge 3 ] || { echo "::error::ожидалось 3 неудачные попытки, было $tries"; rc=1; }
          grep -qE "UKI: devuz_${bad}\+0-[0-9]+\.efi" rollback.log ||
            { echo "::error::UKI «битой» версии не помечен как плохой (+0-N)"; rc=1; }
          exit $rc

      - name: Сжатие и размеры
        if: env.SABOTAGE == 'none'
        run: |
          cd "$WORK/output-prod"
          {
            echo "## Размеры"
            echo "Сборка шла ${BUILD_SECONDS} с."
            echo '```'
            ls -la --block-size=K | grep -v '^total'
          } >>"$GITHUB_STEP_SUMMARY"
          for f in *.raw; do zstd -q -T0 -10 --rm "$f"; done
          {
            echo "--- после сжатия ---"
            ls -la --block-size=K *.zst
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Разница пакетов с последней сборкой main
        if: github.event_name == 'pull_request' && env.SABOTAGE == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
                   --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          echo "## Пакеты: разница с main" >>"$GITHUB_STEP_SUMMARY"
          if [ -z "$run_id" ]; then
            echo "Зелёной сборки main ещё нет — сравнивать не с чем." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p prev
          if ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" --pattern 'devuz-manifest-*' --dir prev; then
            echo "Манифест сборки main не скачался." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          old_pkgs=$(mktemp); new_pkgs=$(mktemp)
          python3 -c 'import json,sys; [print(p["name"], p["version"]) for p in json.load(open(sys.argv[1]))["packages"]]' \
            "$(find prev -name '*.manifest' | head -n1)" | sort >"$old_pkgs" || true
          python3 -c 'import json,sys; [print(p["name"], p["version"]) for p in json.load(open(sys.argv[1]))["packages"]]' \
            "$(find "$WORK/output-prod" -name '*.manifest' | head -n1)" | sort >"$new_pkgs" || true
          {
            echo '```diff'
            diff -u "$old_pkgs" "$new_pkgs" | tail -n +3 || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Артефакт — образ
        if: env.SABOTAGE == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: devuz-image-${{ env.DEVUZ_VERSION }}
          path: |
            /mnt/devuz/output-prod/devuz_${{ env.DEVUZ_VERSION }}.raw.zst
          compression-level: 0
          retention-days: 7

      - name: Артефакт — UKI и разделы
        if: env.SABOTAGE == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: devuz-parts-${{ env.DEVUZ_VERSION }}
          path: |
            /mnt/devuz/output-prod/*.efi
            /mnt/devuz/output-prod/*.raw.zst
            !/mnt/devuz/output-prod/devuz_${{ env.DEVUZ_VERSION }}.raw.zst
          compression-level: 0
          retention-days: 7

      - name: Артефакт — манифест и журнал загрузки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devuz-manifest-${{ env.DEVUZ_VERSION }}
          path: |
            /mnt/devuz/output-prod/*.manifest
            boot.log
            update.log
            luks.log
            rollback.log
          if-no-files-found: warn
          retention-days: 7
