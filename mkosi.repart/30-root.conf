# Временный root с /etc и /var (неделя 1). На неделе 2 его не будет в
# образе: root с шифрованием создастся при первой загрузке.
[Partition]
Type=root
Format=ext4
CopyFiles=/:/
# Содержимое /usr лежит в своём разделе; сам каталог /usr остаётся
# точкой монтирования.
ExcludeFilesTarget=/usr/
Minimize=guess
SplitName=root
