# Подпись корня хеша /usr версии A. На неделе 2 ключ тестовый (создаётся
# на лету в Actions), проверять подпись при загрузке ядро начнёт на неделе 3
# вместе с Secure Boot.
[Partition]
Type=usr-verity-sig
Label=%M_%A_verity_sig
Verity=signature
VerityMatchKey=usr
SplitName=usr-verity-sig
