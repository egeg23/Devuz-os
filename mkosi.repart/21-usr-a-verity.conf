# Хеш-дерево dm-verity для /usr версии A.
[Partition]
Type=usr-verity
Label=%M_%A_verity
Verity=hash
VerityMatchKey=usr
# Для 2 ГБ данных дерево занимает ~16 МБ; берём с запасом и одинаково для
# обоих слотов.
SizeMinBytes=64M
SizeMaxBytes=64M
SplitName=usr-verity
