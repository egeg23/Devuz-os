# /usr версии A: erofs, только чтение. Ярлык «devuz_<версия>» — по нему
# systemd-sysupdate на неделе 2 поймёт, какая версия где лежит.
[Partition]
Type=usr
Label=%M_%A
Format=erofs
CopyFiles=/usr:/
# Оба слота одного размера, иначе новая версия может не влезть в слот B.
SizeMinBytes=2G
SizeMaxBytes=2G
SplitName=usr
