# /usr версии A: erofs, только чтение, под защитой dm-verity.
# Ярлык «devuz_<версия>» — по нему systemd-sysupdate поймёт, какая версия где.
[Partition]
Type=usr
Label=%M_%A
Format=erofs
CopyFiles=/usr:/
# Данные для dm-verity: хеш-дерево лежит в разделе 21-usr-a-verity, корень
# хеша (usrhash=) mkosi вписывает в строку ядра внутри UKI. Изменённый
# байт в этом разделе — ошибка чтения, а не тихая подмена.
Verity=data
VerityMatchKey=usr
# Оба слота одного размера, иначе новая версия может не влезть в слот B.
SizeMinBytes=2G
SizeMaxBytes=2G
SplitName=usr
