# Пустой второй слот /usr для обновлений A/B. Без Format= и CopyFiles=.
# Ярлык «_empty» — так systemd помечает свободный слот: его не монтируют,
# а systemd-sysupdate знает, что сюда можно писать новую версию.
[Partition]
Type=usr
Label=_empty
# Размер — как у слота A (20-usr-a.conf).
SizeMinBytes=2G
SizeMaxBytes=2G
# Отдельным файлом не выгружаем: это 2 ГБ нулей.
SplitName=-
